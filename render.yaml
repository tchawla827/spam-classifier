services:
  - type: web
    name: spam-classifier-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ARTIFACT_BUNDLE_DIR
        value: ml/artifacts/bundle
      - key: LOG_LEVEL
        value: info
      # Set these in the Render dashboard — do not store secrets in this file
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
